name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jobs" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t distributed-job-queue .
